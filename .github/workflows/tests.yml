name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # same as the backend image (python:3.10-slim)

      - name: Install tshark and build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tshark libpcap-dev cmake

      - name: Build fastscan
        run: |
          cmake -S fast_scan -B fast_scan/build
          make -C fast_scan/build
          sudo cp fast_scan/build/fastscan /usr/local/bin/fastscan

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
