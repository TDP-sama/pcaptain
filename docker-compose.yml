# All settings come from .env (see .env.example); every one has a default, so
# `docker compose up` also works without a .env file. Nothing is bind-mounted
# except the pcap directory, so the same images run on any machine.
#
# The browser only talks to the frontend: it forwards /api/ to the backend
# over this compose network. Only the frontend port needs to be reachable.
#
# The pcap folder (PCAP_DIRECTORIES, default ./pcaps) must exist: compose
# refuses to start instead of silently creating an empty, root-owned folder
# when the path is missing or mistyped.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --port ${REDIS_INTERNAL_PORT:-6379}
    environment:
      - REDIS_INTERNAL_PORT=${REDIS_INTERNAL_PORT:-6379}
    volumes:
      - redis_data:/data
    # "healthy" only once Redis answers PONG, i.e. after it has finished loading
    # its dataset; the backend waits for that before starting.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p $${REDIS_INTERNAL_PORT} ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 150
      start_period: 5s
    networks:
      - app_network

  backend:
    image: ${IMAGE_PREFIX:-pcaptain}-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Optional: only for using the REST API directly (curl, scripts). It has
      # no authentication, so by default it only listens on this machine; set
      # BE_BIND_ADDRESS=0.0.0.0 to reach it from other hosts. The web UI does
      # not need it (it goes through the frontend's /api/).
      - "${BE_BIND_ADDRESS:-127.0.0.1}:${BE_BASE_PORT:-7000}:${BE_INTERNAL_PORT:-7000}"
    volumes:
      - type: bind
        source: ${PCAP_DIRECTORIES:-./pcaps}
        target: /pcaps
        read_only: true
        bind:
          create_host_path: false
      - export_cache:/data/exports
    # tshark needs about 0.5 GB per process; this caps a full scan plus
    # exports running together so they cannot take the whole host.
    mem_limit: ${BACKEND_MEMORY_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('PORT', '7000'), timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    environment:
      - PORT=${BE_INTERNAL_PORT:-7000}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_INTERNAL_PORT:-6379}
      - REDIS_WAIT_SECONDS=${REDIS_WAIT_SECONDS:-}
      - PCAP_ROOT_DIRECTORY=/pcaps
      - PCAP_PREFIX_STR=${PCAP_DIRECTORIES:-./pcaps}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SCAN_MODE=${SCAN_MODE:-}
      - PCAP_SCAN_INTERVAL_SECONDS=${PCAP_SCAN_INTERVAL_SECONDS:-}
      - MAX_PARALLEL_SCANS=${MAX_PARALLEL_SCANS:-}
      - LARGE_FILE_SIZE=${LARGE_FILE_SIZE:-}
      - LARGE_FILE_PARALLEL_SCANS=${LARGE_FILE_PARALLEL_SCANS:-}
      - TSHARK_SESSION_RESET=${TSHARK_SESSION_RESET:-}
      - QUICK_SCAN_PEBC=${QUICK_SCAN_PEBC:-}
      - QUICK_SCAN_MIN_FILE_SIZE=${QUICK_SCAN_MIN_FILE_SIZE:-}
      - QUICK_SCAN_CONFIG_VERSION=${QUICK_SCAN_CONFIG_VERSION:-}
      - EXPORT_CACHE_MAX_SIZE=${EXPORT_CACHE_MAX_SIZE:-}
      - EXPORT_MAX_JOBS=${EXPORT_MAX_JOBS:-}
    networks:
      - app_network

  frontend:
    image: ${IMAGE_PREFIX:-pcaptain}-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      # Wait until the API answers, so the first page load is not a 502.
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5000}:80"
    environment:
      - NGINX_PORT=80
      - BACKEND_UPSTREAM=backend:${BE_INTERNAL_PORT:-7000}
      # Leave empty: the UI then calls /api/ on whatever host served it.
      - BE_PUBLIC_URL=${BE_PUBLIC_URL:-}
    networks:
      - app_network

volumes:
  redis_data:
  export_cache:

networks:
  app_network:
    driver: bridge
