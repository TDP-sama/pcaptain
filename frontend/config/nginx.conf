server {
    listen      ${NGINX_PORT};
    server_name localhost;

    root /usr/share/nginx/html;

    index search-index.html;

    # Preserve port in redirects
    port_in_redirect off;
    absolute_redirect off;

    # The UI files change with every deploy. Without this header browsers cache
    # them heuristically and keep showing an old page after an update; no-cache
    # makes them revalidate (a cheap 304 when nothing changed).
    add_header Cache-Control "no-cache" always;

    # The browser talks only to this server: /api/* is forwarded to the backend
    # over the compose network. The UI therefore works from any host name
    # without knowing where the backend runs (it used to call
    # http://localhost:7000 from the user's own machine).
    location /api/ {
        # Resolve the backend through Docker's DNS on every request (cached 10s)
        # instead of once at startup: a restarted backend container can come
        # back with a new IP, and nginx would otherwise keep answering 502.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://${BACKEND_UPSTREAM};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large pcap downloads: stream them instead of spooling to disk, and
        # allow slow transfers.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Dashboard route
    location /dashboard {
        alias /usr/share/nginx/html/dashboard;
        index index.html;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Search UI (default)
    location / {
        try_files $uri $uri/ /search-index.html;
    }

    location /components/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}