<div id="infoBackdrop" class="info-backdrop" hidden></div>
<aside id="infoModal" class="info-drawer" role="dialog" aria-modal="true" aria-labelledby="infoTitle" hidden>
    <header class="info-head">
        <div class="info-head-text">
            <span class="info-kicker">Capture details</span>
            <h2 id="infoTitle"><span id="infoFilename"></span></h2>
        </div>
        <button type="button" id="infoClose" class="icon-btn" aria-label="Close details">
            <i class="fa fa-times" aria-hidden="true"></i>
        </button>
    </header>

    <div class="info-body">
        <section class="info-section">
            <div class="info-label">Full path</div>
            <div class="info-path"><span id="infoPath"></span>
                <button type="button" id="infoCopyPath" class="icon-btn" title="Copy path" aria-label="Copy path">
                    <i class="fa fa-clone" aria-hidden="true"></i>
                </button>
            </div>
        </section>

        <dl class="info-grid">
            <div><dt>Size</dt><dd id="infoSize"></dd></div>
            <div><dt>Total packets</dt><dd id="infoPackets"></dd></div>
            <div><dt>Packets scanned</dt><dd id="infoPacketsScanned"></dd></div>
            <div><dt>Scan mode</dt><dd id="infoScanMode"></dd></div>
            <div id="infoScanPebcRow"><dt>Quick scan share</dt><dd id="infoScanPebc"></dd></div>
            <div id="infoScanConfigVersionRow"><dt>Config version</dt><dd id="infoScanConfigVersion"></dd></div>
            <div><dt>Last modified</dt><dd id="infoModified"></dd></div>
            <div><dt>Last scanned</dt><dd id="infoScanned"></dd></div>
        </dl>

        <section class="info-section">
            <div class="protocol-header">
                <div class="info-label">Protocols found</div>
                <input type="search" id="protocolSearchInput" placeholder="Filter protocols" aria-label="Filter protocols">
            </div>
            <div class="protocol-table-wrapper">
                <table id="protocolTable" class="protocol-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="protocol" title="Sort by protocol">Protocol <i class="fa fa-sort" aria-hidden="true"></i></th>
                            <th class="sortable num" data-sort="percent" title="Sort by share of packets">% <i class="fa fa-sort" aria-hidden="true"></i></th>
                            <th class="sortable num" data-sort="count" title="Sort by packet count">Packets <i class="fa fa-sort" aria-hidden="true"></i></th>
                            <th><span class="sr-only">Export</span></th>
                        </tr>
                    </thead>
                    <tbody id="protocolTableBody"></tbody>
                </table>
            </div>
        </section>
    </div>
</aside>
